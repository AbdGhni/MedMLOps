[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medmlops"
version = "2.0.0rc1"
description = "Reproducible medical ML platform on synthetic data"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "scipy==1.14.1", "scikit-learn==1.7.2", "pandas==2.3.3", "pydantic==2.12.3", "Flask==3.1.3"]

[project.scripts]
medmlops = "medmlops.cli:main"

[tool.setuptools.package-data]
medmlops = ["static/*.html"]

[tool.setuptools.packages.find]
include = ["medmlops*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI dependency injection signature convention.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test_*"]
