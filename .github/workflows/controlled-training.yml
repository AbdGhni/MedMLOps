name: explicit-candidate-training
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: [self-hosted, medmlops-local]
    environment: local-demo
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --require-hashes -r requirements-target.lock
      - run: python -m medmlops.pipeline all --work runtime/manual-candidate
      - name: Publish candidate only
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          OPERATOR: ${{ github.actor }}
        run: python -m medmlops.tracking publish --work runtime/manual-candidate --actor "$OPERATOR"
# Requires an operator-managed local runner with the existing demo stack.
# No approval or deployment step is present in this workflow.
