name: v2-core-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          cache: pip
          cache-dependency-path: requirements-target.lock
      - run: python -m pip install --require-hashes -r requirements-target.lock
      - run: python -m pip check
      - run: python -m compileall -q medmlops scripts tests
      - run: python -m scripts.validate_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-core-evidence
          path: |
            docs/validation/evidence-v2
            runtime/verification-v2/*.txt
# This workflow verifies the core; target-platform-ci verifies service integrations.
# No model promotion is performed by this workflow.
